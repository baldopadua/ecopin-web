# EcoPin Web - Production Nginx Reverse Proxy Configuration
# Target Scope: ecopin-web (Next.js 16 App Router)
# Purpose: Enforce Cache-Control: no-store on internal dashboard routes, session, and backend proxy
#          to prevent public edge, CDN, and intermediate caching of internal HTML shells.

upstream nextjs_upstream {
    server 127.0.0.1:4001; # Next.js production server
    keepalive 64;
}

# Cache zone for static assets only
proxy_cache_path /var/cache/nginx/ecopin_static levels=1:2 keys_zone=ecopin_static_cache:10m max_size=1g inactive=365d use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name app.ecopin.ph;

    # Canonical HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.ecopin.ph;

    # TLS Certificates & Security Configuration (TLS 1.3 primary / TLS 1.2 compatibility)
    ssl_certificate /etc/ssl/certs/ecopin_bundle.crt;
    ssl_certificate_key /etc/ssl/private/ecopin.key;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_conf_cmd Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Global Security Headers (WT-50 Strict HSTS)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Proxy Common Headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # =========================================================================
    # 1. Internal Dashboard & Authenticated Routes
    #    STRICT ANTI-CACHING ENFORCEMENT (WT-49)
    #    Never allow edge proxy, CDN, or intermediate caches to store internal
    #    HTML shells, RSC data, or session responses.
    # =========================================================================
    location ~ ^/(dashboard|force-change-password|api/session|api/backend)(/|$) {
        proxy_pass http://nextjs_upstream;

        # Bypass and disable any nginx proxy caching
        proxy_cache_bypass 1;
        proxy_no_cache 1;

        # Force anti-caching headers downstream to edge CDNs and browsers
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Surrogate-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;

        # Ensure cookie variance
        add_header Vary "Cookie, Accept-Encoding" always;
    }

    # =========================================================================
    # 2. Immutable Static Assets (_next/static)
    #    Safe to cache aggressively at edge and browser because filenames
    #    contain content hashes.
    # =========================================================================
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_cache ecopin_static_cache;
        proxy_cache_valid 200 365d;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # =========================================================================
    # 3. Public Static Files (favicon, manifest, public assets)
    # =========================================================================
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|avif|css|woff2?)$ {
        proxy_pass http://nextjs_upstream;
        proxy_cache ecopin_static_cache;
        proxy_cache_valid 200 7d;

        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    # =========================================================================
    # 4. Default / Public Pages (Landing, Auth, Explore, etc.)
    #    Pass-through to Next.js; obey upstream Next.js header policies.
    # =========================================================================
    location / {
        proxy_pass http://nextjs_upstream;
    }
}
